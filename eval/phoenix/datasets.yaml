datasets:
  sec-edgar-eval-0:
    csv_path: datasets/sec-edgar-eval-0/examples/sec-edgar-eval-0.csv
    input_keys:
      - query
    output_keys:
      - responses
    description: >
      20 questions across 10 scenario categories covering all 8 SEC EDGAR tools.
      Includes easy (single-tool), medium (two-tool chains), and hard (multi-step,
      cross-company comparison, source attribution) questions.

  sec-edgar-eval-1:
    csv_path: datasets/sec-edgar-eval-1/examples/sec-edgar-eval-1.csv
    input_keys:
      - query
    output_keys:
      - responses
    metadata_keys:
      - metadata
    description: >
      23 questions across 11 scenario categories covering all 8 SEC EDGAR tools.
      Extends sec-edgar-eval-0 with 3 out-of-scope refusal questions (BQ-21/22/23)
      and adds a metadata column containing numeric_checks (for the numeric judge),
      category, and difficulty. Build this CSV with: python build_dataset.py
